<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIM-Risiko RSD K.R.M.T Wongsonegoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#A3161C; --red-ink:#7E0F14; --gold:#C99700; --gold-soft:#FFF4D1;
  --ink:#1B1F23; --ink-2:#4A535C; --ink-3:#6E7781;
  --paper:#FFFFFF; --surface:#F3F4F6; --surface-2:#E9EBEE; --line:#DADDE1;
  --lv1:#2E75B6; --lv2:#3A9D4A; --lv3:#F2C200; --lv4:#C62828; --lv3-ink:#1B1F23;
  --ok:#2E7D32; --warn:#B26A00; --bad:#C62828;
  --focus:#2E75B6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --red:#E0565B; --red-ink:#FF8A8E; --gold:#E3B33C; --gold-soft:#3A3115;
    --ink:#ECEEF0; --ink-2:#C2C8CE; --ink-3:#98A1AA;
    --paper:#1A1D21; --surface:#111316; --surface-2:#24282D; --line:#33383E;
    --lv3-ink:#1B1F23; --focus:#6CB2F0; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --red:#E0565B; --red-ink:#FF8A8E; --gold:#E3B33C; --gold-soft:#3A3115;
  --ink:#ECEEF0; --ink-2:#C2C8CE; --ink-3:#98A1AA;
  --paper:#1A1D21; --surface:#111316; --surface-2:#24282D; --line:#33383E;
  --lv3-ink:#1B1F23; --focus:#6CB2F0; --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--surface);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--focus)}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--paper);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 4px}
.brand img{width:40px;height:auto}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{color:var(--ink-3);font-size:12px;line-height:1.3;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:14px}
.nav button .lp{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--surface)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:700}
.nav button:focus-visible{outline:2px solid var(--focus)}
.nav .grp{font-size:12px;color:var(--ink-3);padding:10px 10px 4px;font-weight:600}
.who{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.who .r{display:flex;align-items:center;gap:8px}
.who img{width:28px;height:28px;border-radius:50%}
.rolepill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.rp-L1{background:#FBE3E4;color:#7E0F14}.rp-L2{background:var(--gold-soft);color:#6B5000}.rp-L3{background:#DCEBF8;color:#1C4E7A}
:root[data-theme="dark"] .rp-L1{background:#4A1D1F;color:#FFB3B5}
/* main */
.main{padding:22px 28px 40px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
h3{font-size:15px;margin:0 0 6px;font-weight:700}
.sub{color:var(--ink-3);font-size:14px;margin-top:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters label{font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px}
select,input[type=text],input[type=number],input[type=date],input[type=datetime-local],textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;max-width:100%}
textarea{min-height:70px;resize:vertical;width:100%}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:14px;min-height:36px}
.btn:hover{background:var(--surface)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.25fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .h{font-size:12px;color:var(--ink-3)}
.kpi.alert .v{color:var(--bad)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px;background:var(--gold-soft);border:1px solid #E8D28A;color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.lv{display:inline-block;min-width:44px;text-align:center;padding:2px 8px;border-radius:6px;font-weight:700;font-size:13px;white-space:nowrap}
.lv-1{background:var(--lv1);color:#fff}.lv-2{background:var(--lv2);color:#fff}.lv-3{background:var(--lv3);color:var(--lv3-ink)}.lv-4{background:var(--lv4);color:#fff}.lv-0{background:var(--surface-2);color:var(--ink-3)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:var(--paper)}
.tag.ok{border-color:#9BCB9E;color:var(--ok);background:#EEF7EE}.tag.bad{border-color:#E7A3A3;color:var(--bad);background:#FDEEEE}.tag.warn{border-color:#E6C27A;color:var(--warn);background:#FFF6E3}
:root[data-theme="dark"] .tag.ok,:root[data-theme="dark"] .tag.bad,:root[data-theme="dark"] .tag.warn{background:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.ok,:root:not([data-theme="light"]) .tag.bad,:root:not([data-theme="light"]) .tag.warn{background:transparent}}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* heatmap */
.heat{display:grid;grid-template-columns:28px repeat(5,minmax(44px,1fr));gap:4px;align-items:stretch}
.heat .c{aspect-ratio:1.6;border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;cursor:pointer;border:0;text-align:left}
.heat .c .s{font-size:11px;opacity:.8}
.heat .c .n{font-size:22px;font-weight:800;align-self:flex-end;line-height:1}
.heat .c.z .n{opacity:.35;font-weight:600;font-size:16px}
.heat .ax{font-size:12px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-weight:700}
.heat .c:hover{filter:brightness(1.06)}
.bars .b{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bars .t{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bars .t i{display:block;height:100%}
.alerts li{margin:0 0 8px;font-size:14px}
.alerts{padding-left:18px;margin:0}
.chk{font-weight:800}
.chk.y{color:var(--ok)}.chk.n{color:var(--bad)}.chk.na{color:var(--ink-3);font-weight:500}
/* modal */
dialog{border:0;border-radius:14px;padding:0;width:min(860px,94vw);max-height:90vh;background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(17,19,22,.5)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
.mh h2{margin:0;font-size:17px}
.mb{padding:16px 18px;overflow:auto;max-height:calc(90vh - 130px)}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--paper)}
.fs{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.fs legend{font-weight:700;padding:0 6px;font-size:14px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.f > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.f .hint{font-size:12px;color:var(--ink-3)}
.f input,.f select,.f textarea{width:100%}
.fg{display:grid;gap:10px}
.fg2{grid-template-columns:1fr 1fr}.fg3{grid-template-columns:repeat(3,1fr)}.fg4{grid-template-columns:repeat(4,1fr)}
.calc{background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rows .rr{display:grid;gap:6px;margin-bottom:6px;align-items:start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90vw}
details.g{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0 16px;margin-bottom:10px}
details.g summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
details.g summary::-webkit-details-marker{display:none}
details.g summary .st{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;align-items:center;justify-content:center;font-size:13px;flex:none}
details.g[open] summary{border-bottom:1px solid var(--line)}
details.g .gb{padding:12px 0 14px;font-size:14px}
details.g .gb p{margin:0 0 8px;max-width:78ch}
details.g .gb ol,details.g .gb ul{margin:0 0 8px;padding-left:20px;max-width:78ch}
.ex{background:var(--surface);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.ex b{color:var(--red-ink)}
.mobilebar{display:none}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav .grp{display:none}
  .nav button{white-space:nowrap}
  .nav button .lp{display:none}
  .who{margin-top:0}
  .g2,.g3{grid-template-columns:1fr}
  .fg2,.fg3,.fg4{grid-template-columns:1fr}
  .main{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.side,.topbar .filters,.btn{display:none!important}.app{display:block}}
</style>
</head>

<script>
"use strict";
/* ========== Utilities ========== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const TODAY = new Date();
const fmtDate = (s) => { if (!s) return "–"; const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }); };
const fmtDT = (s) => { if (!s) return "–"; const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : null);
let toastT;
function toast(msg) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200); }

const KATEGORI = ["Klinis", "Kepatuhan", "Operasional", "Keuangan", "Strategis", "Kecurangan (fraud)", "Reputasi", "Hukum"];

COLS.forEach((c) => (S[c] = {}));
(function initPeriod() { const q = Math.floor(TODAY.getMonth() / 3) + 1; let t = TODAY.getFullYear(), tw = q - 1; if (tw === 0) { tw = 4; t -= 1; } S.f = { tahun: t, tw, unit: "all" }; })();

/* ========== Level helpers (Lampiran 3) ========== */
function lvl(sc) {
  if (!sc) return { i: 0, n: "–" };
  if (S.cfg.acuan === "3A") return sc <= 4 ? { i: 1, n: "Rendah" } : sc <= 9 ? { i: 2, n: "Sedang" } : sc <= 15 ? { i: 3, n: "Tinggi" } : { i: 4, n: "Sangat Tinggi" };

const WARNA3A = ["", "Hijau", "Kuning", "Oranye", "Merah"];

const lvBadge = (sc, label) => { const L = lvl(sc); return `<span class="lv lv-${L.i}" title="${esc(L.n)}">${esc(label ?? (sc ? sc + " " + L.n : "–"))}</span>`; };
const inh = (r) => (+r.K || 0) * (+r.D || 0);
const res = (r) => (r.Kr && r.Dr ? +r.Kr * +r.Dr : inh(r));
const tgt = (t) => (t.Kt && t.Dt ? +t.Kt * +t.Dt : 0);
function konteks(unitId, tahun) { return S.units[unitId]?.konteks?.[tahun] || null; }
function seleraMaks(unitId, tahun) { const k = konteks(unitId, tahun); return k?.selera?.maks ? +k.selera.maks : +S.cfg.seleraDefault || 12; }
const isPrio = (r) => res(r) > seleraMaks(r.unitId, r.tahun);
const uraian = (r) => `Kemungkinan ${r.peristiwa || "…"} yang disebabkan ${r.penyebab || "…"}, sehingga ${r.dampak || "…"}.`;
const pkey = (t, tw) => `${t}-${tw}`;
const pend = (k) => { const [t, tw] = String(k).split("-").map(Number); return new Date(t, tw * 3, 0, 23, 59, 59); };
const plabel = (k) => { if (!k) return "–"; const [t, tw] = String(k).split("-"); return `TW ${["", "I", "II", "III", "IV"][+tw] || tw} ${t}`; };
const inPeriod = (dt, t, tw) => { const d = new Date(dt); return d.getFullYear() === +t && Math.floor(d.getMonth() / 3) + 1 === +tw; };
function rtpDone(t) { return Object.values(t.monitor || {}).some((m) => m.status === "Sudah"); }
function rtpStatus(t) { if (rtpDone(t)) return "Selesai"; if (t.target && pend(t.target) < TODAY) return "Terlambat"; return "Berjalan"; }
function rcaDue(r) { const base = r.validatedAt || r.createdAt; return base ? new Date(new Date(base).getTime() + 45 * 864e5) : null; }
function needsRCA(r) { return lvl(res(r)).i >= 3; }
function rcaState(r) { if (!needsRCA(r)) return "na"; if (r.rca?.tanggal) return "ok"; const d = rcaDue(r); return d && d < TODAY ? "late" : "open"; }
const hours = (a, b) => (a && b ? (new Date(b) - new Date(a)) / 36e5 : null);
const wajibSIK = (e) => e.jenis === "KTD" || e.jenis === "Sentinel";
const wajib24 = (e) => e.jenis === "Sentinel" || !!e.signifikan;
const ok24 = (e) => { const h = hours(e.waktuKejadian, e.waktuLapor); return h !== null && h <= 24; };
const unitName = (id) => S.units[id]?.nama || "(unit dihapus)";
const unitsSorted = () => Object.entries(S.units).sort((a, b) => (a[1].nama || "").localeCompare(b[1].nama || ""));

let DB = null, USER = null, DL = null;
const LKEY = "simrisiko-local-v1";
function saveLocal() { try { const o = { cfg: S.cfg }; COLS.forEach((c) => (o[c] = S[c])); localStorage.setItem(LKEY, JSON.stringify(o)); } catch (e) {} }
function loadLocal() { try { const o = JSON.parse(localStorage.getItem(LKEY) || "null"); if (o) { COLS.forEach((c) => (S[c] = o[c] || {})); if (o.cfg) S.cfg = Object.assign(S.cfg, o.cfg); } } catch (e) {} }
async function put(col, id, data) {
  data.updatedAt = new Date().toISOString();
  if (S.mode === "db") {
    try { await DB.collection(col).doc(id).set(data); return true; }
    catch (e) {
      if (e && e.code === "invalid_argument") { toast("Perubahan ditolak: akun Anda tidak memiliki hak menulis data bersama."); S.readOnly = true; render(); }
      else if (e && e.code === "quota_exceeded") toast("Kapasitas data penuh. Hapus data lama, lalu coba lagi.");
      else toast("Gagal menyimpan. Periksa koneksi, lalu coba lagi.");
      return false;
    }
  }
  S[col][id] = data; saveLocal(); render(); return true;
}
async function del(col, id) {
  if (S.mode === "db") { try { await DB.collection(col).doc(id).delete(); return true; } catch (e) { toast("Gagal menghapus data."); return false; } }
  delete S[col][id]; saveLocal(); render(); return true;
}
async function putCfg(cfg) {
  S.cfg = cfg;
  if (S.mode === "db") { try { await DB.doc("config/main").set(cfg); } catch (e) { toast("Gagal menyimpan pengaturan."); } }
  else { saveLocal(); render(); }
}
let rq = 0;
function render() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; doRender(); }); }

async function init() {
  const cl = window.claude;
  if (cl && typeof cl.use === "function") {
    try { [DB, USER, DL] = await Promise.all([cl.use("db"), cl.use("user"), cl.use("downloads")]); } catch (e) {}
  }
  let id = null;
  if (DB && USER) { try { id = await USER.id(); } catch (e) {} }
  if (DB && id) {
    S.mode = "db";
    const me = await USER.me();
    S.me.id = id; S.me.isOwner = !!me.isOwner; S.me.name = me.name || ""; S.me.avatar = me.avatarUrl || "";
    try { const w = await USER.can("data.write"); if (w === false) S.readOnly = true; } catch (e) {}
    DB.doc("config/main").onSnapshot((d) => { if (d.exists) S.cfg = Object.assign({ tahun: TODAY.getFullYear(), acuan: "3B", seleraDefault: 12 }, d.data()); render(); }, () => {});
    COLS.forEach((c) => {
      DB.collection(c).onSnapshot((snap) => {
        const o = {}; snap.docs.forEach((d) => (o[d.id] = d.data())); S[c] = o;
        if (c === "members") { const m = o[S.me.id]; S.me.role = m?.role || null; S.me.unitId = m?.unitId || null; refreshProfiles(); }
        S.loaded = S.loaded || {}; S.loaded[c] = true; render();
      }, (e) => { if (e && e.code === "revoked") { S.mode = "revoked"; render(); } });
    });
  } else {
    S.mode = "local"; loadLocal(); S.me.role = S.ui.localRole || "L2"; S.loaded = {}; COLS.forEach((c) => (S.loaded[c] = true));
  }
  render();
}

/* ========== Compliance (dipakai Dasbor & SPI) ========== */
function compliance(unitId, t, tw) {
  const k = konteks(unitId, t);
  const rs = Object.entries(S.risks).filter(([, r]) => r.unitId === unitId && +r.tahun === +t);
  const rt = Object.entries(S.rtps).filter(([, x]) => x.unitId === unitId && S.risks[x.riskId] && +S.risks[x.riskId].tahun === +t);
  const ev = Object.values(S.events).filter((e) => e.unitId === unitId && new Date(e.waktuKejadian).getFullYear() === +t);
  const prio = rs.filter(([, r]) => isPrio(r));
  const rep = S.reports[`${unitId}_${pkey(t, tw)}`];
  const sik = ev.filter(wajibSIK), w24 = ev.filter(wajib24);
  const c = [
    ["Konteks unit (Lamp. 1) lengkap", !!(k && k.visi && (k.sasaran || []).length && k.selera?.maks)],
    ["Risiko teridentifikasi", rs.length > 0],
    ["Semua risiko tervalidasi UMR", rs.length ? rs.every(([, r]) => r.status === "Tervalidasi") : null],
    ["Risiko prioritas memiliki RTP", prio.length ? prio.every(([id]) => rt.some(([, x]) => x.riskId === id)) : null],
    ["RCA risiko Tinggi/Sangat Tinggi ≤ 45 hari", rs.some(([, r]) => needsRCA(r)) ? rs.every(([, r]) => rcaState(r) !== "late") : null],
    ["Tidak ada RTP terlambat", rt.length ? rt.every(([, x]) => rtpStatus(x) !== "Terlambat") : null],
    [`Laporan ${plabel(pkey(t, tw))} dikirim`, rep?.status === "Dikirim"],
    ["KTD/Sentinel dilaporkan ke SIK", sik.length ? sik.every((e) => e.sik === "Ya") : null],
    ["Sentinel/kejadian signifikan dilaporkan ≤ 1×24 jam", w24.length ? w24.every(ok24) : null],
  ];
  const app = c.filter((x) => x[1] !== null), pass = app.filter((x) => x[1]).length;
  return { items: c, score: pct(pass, app.length) };
}

/* ========== VIEW: Dasbor ========== */
function vDashboard() {
  const rs = risksY(), rt = rtpsY(), evY = eventsP(true), evP = eventsP(false), key = pkey(S.f.tahun, S.f.tw);
  const prio = rs.filter(([, r]) => isPrio(r));
  const merah = rs.filter(([, r]) => lvl(res(r)).i === 4);
  const due = rt.filter(([, t]) => t.target === key);
  const dueDone = due.filter(([, t]) => rtpDone(t));
  const late = rt.filter(([, t]) => rtpStatus(t) === "Terlambat");
  const ktd = evP.filter(([, e]) => wajibSIK(e));
  const units = unitsSorted().filter(([id]) => unitFilterOk(id));
  const comps = units.map(([id]) => compliance(id, S.f.tahun, S.f.tw).score).filter((x) => x !== null);
  const avgC = comps.length ? Math.round(comps.reduce((a, b) => a + b, 0) / comps.length) : null;
  const sub = `Data ${S.f.unit === "all" ? "seluruh unit" : esc(unitName(S.f.unit))}, tahun ${S.f.tahun}, periode ${plabel(key)}. Level memakai Lampiran ${esc(S.cfg.acuan)}.`;
  let h = head("Dasbor pemantauan", sub, filterBar());
  if (!Object.keys(S.units).length) return h + emptyBox("Belum ada unit kerja", "Tambahkan unit kerja di Pengaturan agar setiap Lini 1 dapat mulai mengisi konteks dan register risiko.", isAdmin() ? `<button class="btn pri" data-act="go" data-v="settings">Buka pengaturan</button>` : "");
  h += `<div class="kpis">
    ${kpi(rs.length, "Risiko teridentifikasi", `${rs.filter(([, r]) => r.status === "Tervalidasi").length} tervalidasi UMR`)}
    ${kpi(prio.length, "Risiko prioritas", "Residu di atas selera unit")}
    ${kpi(merah.length, "Risiko merah", "Sangat Tinggi, eskalasi Direktur", merah.length > 0)}
    ${kpi(pct(dueDone.length, due.length) === null ? "–" : pct(dueDone.length, due.length) + "%", "Realisasi RTP " + plabel(key), `${dueDone.length} dari ${due.length} jatuh tempo`)}
    ${kpi(late.length, "RTP terlambat", "Lewat target, belum selesai", late.length > 0)}
    ${kpi(evP.length, "Peristiwa " + plabel(key), `${ktd.length} KTD/Sentinel`)}
    ${kpi(avgC === null ? "–" : avgC + "%", "Kepatuhan proses", "Rata-rata indeks per unit", avgC !== null && avgC < 70)}
  </div>`;
  // heatmap
  const cnt = {}; rs.forEach(([, r]) => { const k = (r.Kr || r.K) + "-" + (r.Dr || r.D); cnt[k] = (cnt[k] || 0) + 1; });
  let hm = `<div class="heat" role="grid" aria-label="Peta risiko residu">`;
  for (let k = 5; k >= 1; k--) { hm += `<div class="ax">${k}</div>`; for (let d = 1; d <= 5; d++) { const L = lvl(k * d), n = cnt[k + "-" + d] || 0; hm += `<button class="c lv-${L.i} ${n ? "" : "z"}" data-act="heat" data-k="${k}" data-d="${d}" title="K${k} × D${d} = ${k * d} (${L.n}): ${n} risiko"><span class="s">${k * d}</span><span class="n">${n}</span></button>`; } }
  hm += `<div></div>${[1, 2, 3, 4, 5].map((d) => `<div class="ax">${d}</div>`).join("")}</div><div class="row small muted" style="margin-top:6px"><span>Baris: Kemungkinan (K)</span><span class="spacer"></span><span>Kolom: Dampak (D)</span></div>`;
  const dist = [4, 3, 2, 1].map((i) => [i, rs.filter(([, r]) => lvl(res(r)).i === i).length]);
  const mx = Math.max(1, ...dist.map((x) => x[1]));
  const LVN = ["", "Rendah", "Sedang", "Tinggi", "Sangat Tinggi"];
  const bars = dist.map(([i, n]) => `<div class="b"><span>${LVN[i]} (${warna(i)})</span><span class="t"><i class="lv-${i}" style="width:${(n / mx) * 100}%"></i></span><b class="num">${n}</b></div>`).join("");
  const top = [...rs].sort((a, b) => res(b[1]) - res(a[1]) || (b[1].Dr || b[1].D) - (a[1].Dr || a[1].D)).filter(([, r]) => isPrio(r)).slice(0, 5);
  h += `<div class="grid g2" style="margin-bottom:14px"><div class="panel"><h2>Peta risiko residu</h2><p class="small muted" style="margin:0 0 10px">Angka di tengah sel adalah jumlah risiko. Pilih sel untuk membuka daftarnya di register.</p>${hm}</div>
    <div class="panel"><h2>Distribusi level residu</h2><div class="bars">${bars}</div>
    <h2 style="margin-top:16px">Lima risiko prioritas teratas</h2>${top.length ? `<ol style="margin:0;padding-left:20px">${top.map(([id, r]) => `<li style="margin-bottom:6px">${lvBadge(res(r), String(res(r)))} <a href="#" data-act="openrisk" data-id="${id}">${esc(r.kode || "(belum berkode)")}</a> ${esc(r.peristiwa)} <span class="muted small">· ${esc(unitName(r.unitId))}</span></li>`).join("")}</ol>` : `<p class="muted small">Belum ada risiko di atas selera.</p>`}</div></div>`;
  // alerts + incidents
  const al = alerts(rs, rt, evY, key);
  const jc = JENIS.map((j) => [j, evP.filter(([, e]) => e.jenis === j).length]);
  const jm = Math.max(1, ...jc.map((x) => x[1]));
  h += `<div class="grid g2" style="margin-bottom:14px"><div class="panel"><h2>Perlu tindakan</h2>${al.length ? `<ul class="alerts">${al.map((a) => `<li><span class="rolepill rp-${a.r}">${ROLE_SHORT[a.r]}</span> ${a.t}</li>`).join("")}</ul>` : `<p class="muted">Tidak ada tindakan tertunda untuk filter ini.</p>`}</div>
    <div class="panel"><h2>Peristiwa ${plabel(key)} menurut jenis</h2><div class="bars">${jc.map(([j, n]) => `<div class="b"><span>${j}</span><span class="t"><i style="width:${(n / jm) * 100}%;background:${j === "Sentinel" ? "var(--lv4)" : j === "KTD" ? "#E8711A" : "var(--ink-3)"}"></i></span><b class="num">${n}</b></div>`).join("")}</div>
    <p class="small muted" style="margin:8px 0 0">KTD dan Sentinel wajib dilaporkan ke e-report Kemenkes. Sentinel dan kejadian signifikan wajib dilaporkan ke Direktur dan UMR paling lambat 1×24 jam.</p></div></div>`;
  // per unit
  h += `<div class="panel"><h2>Ringkasan per unit</h2><div class="tablewrap"><table><thead><tr><th>Unit</th><th class="num">Risiko</th><th class="num">Prioritas</th><th class="num">Merah</th><th>RTP selesai</th><th class="num">RTP terlambat</th><th class="num">Peristiwa ${plabel(key)}</th><th>Laporan ${plabel(key)}</th><th class="num">Kepatuhan</th></tr></thead><tbody>${units.map(([id, u]) => {
    const r = Object.entries(S.risks).filter(([, x]) => x.unitId === id && +x.tahun === +S.f.tahun);
    const t = Object.entries(S.rtps).filter(([, x]) => x.unitId === id && S.risks[x.riskId] && +S.risks[x.riskId].tahun === +S.f.tahun);
    const e = Object.values(S.events).filter((x) => x.unitId === id && inPeriod(x.waktuKejadian, S.f.tahun, S.f.tw));
    const rep = S.reports[`${id}_${key}`]; const c = compliance(id, S.f.tahun, S.f.tw).score;
    return `<tr><td><a href="#" data-act="unitfilter" data-id="${id}">${esc(u.nama)}</a></td><td class="num">${r.length}</td><td class="num">${r.filter(([, x]) => isPrio(x)).length}</td><td class="num">${r.filter(([, x]) => lvl(res(x)).i === 4).length}</td><td>${t.filter(([, x]) => rtpDone(x)).length} / ${t.length}</td><td class="num">${t.filter(([, x]) => rtpStatus(x) === "Terlambat").length}</td><td class="num">${e.length}</td><td>${statusTag(rep?.status || "Belum dibuat")}</td><td class="num">${c === null ? "–" : `<b style="color:${c >= 80 ? "var(--ok)" : c >= 60 ? "var(--warn)" : "var(--bad)"}">${c}%</b>`}</td></tr>`;
  }).join("")}</tbody></table></div></div>`;
  return h;
}
const kpi = (v, l, hint, alert) => `<div class="kpi ${alert ? "alert" : ""}"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div><div class="h">${esc(hint)}</div></div>`;
function alerts(rs, rt, ev, key) {
  const a = [];
  const draf = rs.filter(([, r]) => !r.status || r.status === "Draf"); if (draf.length) a.push({ r: "L1", t: `${draf.length} risiko masih draf dan belum diajukan ke UMR.` });

  const noRtp = rs.filter(([id, r]) => isPrio(r) && !Object.values(S.rtps).some((t) => t.riskId === id)); if (noRtp.length) a.push({ r: "L1", t: `${noRtp.length} risiko prioritas belum memiliki RTP.` });

  const rt = Object.entries(S.rtps).filter(([, x]) => x.unitId === unitId && S.risks[x.riskId] && +S.risks[x.riskId].tahun === +t);
  const ev = Object.entries(S.events).filter(([, e]) => e.unitId === unitId && inPeriod(e.waktuKejadian, t, tw));
  const due = rt.filter(([, x]) => x.target === key), done = due.filter(([, x]) => rtpDone(x));

function consolidated(t, tw) {
  const key = pkey(t, tw);
  const rs = Object.entries(S.risks).filter(([, r]) => +r.tahun === +t);
  const rt = Object.entries(S.rtps).filter(([, x]) => S.risks[x.riskId] && +S.risks[x.riskId].tahun === +t);
  const ev = Object.entries(S.events).filter(([, e]) => inPeriod(e.waktuKejadian, t, tw));
  const due = rt.filter(([, x]) => x.target === key), done = due.filter(([, x]) => rtpDone(x));
  const dist = [4, 3, 2, 1].map((i) => rs.filter(([, r]) => lvl(res(r)).i === i).length);
  const top = [...rs].filter(([, r]) => isPrio(r)).sort((a, b) => res(b[1]) - res(a[1]) || (b[1].Dr || b[1].D) - (a[1].Dr || a[1].D)).slice(0, 5);
  const perUnit = unitsSorted().map(([id, u]) => { const d = due.filter(([, x]) => x.unitId === id); return [u.nama, d.length ? pct(d.filter(([, x]) => rtpDone(x)).length, d.length) : null]; }).filter((x) => x[1] !== null).sort((a, b) => b[1] - a[1]);
  const sik = ev.filter(([, e]) => wajibSIK(e));
  const hamb = rt.map(([, x]) => (x.monitor || {})[key]?.hambatan).filter(Boolean);
  const topEv = [...ev].sort((a, b) => JENIS.indexOf(b[1].jenis) - JENIS.indexOf(a[1].jenis) || (+b[1].D || 0) - (+a[1].D || 0)).slice(0, 3);
  return { rs, rt, ev, due, done, dist, top, perUnit, sik, sikOk: sik.filter(([, e]) => e.sik === "Ya").length, late: rt.filter(([, x]) => rtpStatus(x) === "Terlambat"), hamb, topEv, signif: ev.filter(([, e]) => ["KTD", "Sentinel"].includes(e.jenis) || e.signifikan || +e.D >= 3) };
}

  const au = Object.entries(S.audits).filter(([, a]) => unitFilterOk(a.unitId) && (!a.tahun || +a.tahun === +S.f.tahun)).sort((a, b) => String(b[1].createdAt).localeCompare(String(a[1].createdAt)));

  else h += `<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Tanggal</th><th>Unit</th><th>Aspek</th><th>Objek</th><th style="min-width:200px">Temuan</th><th style="min-width:200px">Rekomendasi</th><th>Prioritas</th><th>Batas</th><th>Tanggapan unit</th><th>Status</th><th></th></tr></thead><tbody>${au.map(([id, a]) => `<tr><td>${fmtDate(a.createdAt)}</td><td>${esc(unitName(a.unitId))}</td><td>${esc(a.aspek)}</td><td>${esc(S.risks[a.riskId]?.kode || (a.riskId ? "Risiko" : "Unit"))}</td><td>${esc(a.temuan)}</td><td>${esc(a.rekomendasi)}</td><td>${esc(a.prioritas)}</td><td>${fmtDate(a.batas)}</td><td>${esc(a.tanggapan || "–")}</td><td>${statusTag(a.status)}</td><td><button class="btn sm" data-act="editaudit" data-id="${id}">${canAudit() ? "Ubah" : canEditUnit(a.unitId) ? "Tanggapi" : "Lihat"}</button></td></tr>`).join("")}</tbody></table></div>`;

   ${role("L3", "Satuan Pengawasan Internal", `<ol class="small" style="padding-left:18px;margin:0"><li>Buka <b>Pengawasan SPI</b> untuk melihat indeks kepatuhan per unit.</li><li>Reviu register, RTP, dan laporan unit yang indeksnya rendah.</li><li><b>Catat temuan</b> dan rekomendasi; tetapkan batas tindak lanjut.</li><li>Pantau tanggapan unit sampai temuan berstatus Selesai.</li></ol><p class="small muted" style="margin:6px 0 0">SPI tidak mengisi register atau RTP unit agar tetap independen.</p>`)}
  </div>
  <h2>Langkah pengisian</h2>
  ${step(1, "Konteks unit kerja (Lampiran 1)", `<p><b>Siapa:</b> Pemilik Risiko dibantu Pengelola Risiko. <b>Kapan:</b> awal tahun. <b>Menu:</b> Konteks unit → Isi konteks.</p><ol><li>Tulis visi dan misi unit yang diturunkan dari Renstra.</li><li>Isi sasaran/IKU dengan target dan indikator, lalu tandai kesesuaian dengan indikator mutu nasional.</li><li>Isi proses bisnis utama, output, dan risiko yang melekat.</li><li>Isi pemangku kepentingan, harapan, dan risiko yang dikhawatirkan.</li><li>Tetapkan <b>selera risiko</b> dalam kalimat dan angka (skor maksimal yang masih diterima). Selera unit tidak boleh lebih longgar dari selera rumah sakit: tidak mentoleransi sentinel dan pelanggaran hukum berat.</li></ol><div class="ex"><b>Contoh klinis (Rawat Inap):</b> sasaran "Kejadian pasien jatuh = 0 per tahun"; selera "tidak mentoleransi pasien jatuh dengan cedera berat", batas skor ≤ 12.<br><b>Contoh keuangan (Casemix):</b> sasaran "Klaim pending ≤ 2% nilai klaim per bulan"; batas ≤ 12.<br><b>Contoh reputasi (Rawat Jalan):</b> "tidak mentoleransi keluhan yang diberitakan media"; batas ≤ 6.<br><b>Contoh hukum (Bedah Sentral):</b> "tidak mentoleransi tindakan tanpa persetujuan sah"; batas ≤ 6.</div>`, true)}
  ${step(2, "Identifikasi risiko (Register, Lampiran 4)", `<p><b>Menu:</b> Register risiko → Tambah risiko. Pilih sasaran dari Lampiran 1, lalu isi tiga kolom yang membentuk pernyataan risiko: <b>peristiwa</b>, <b>penyebab</b>, dan <b>dampak</b>. Aplikasi merangkainya menjadi "Kemungkinan … yang disebabkan …, sehingga …".</p><p>Sumber identifikasi: laporan insiden, keluhan, temuan audit, survei akreditasi, indikator mutu yang tidak tercapai, regulasi baru, curah pendapat, dan FMEA.</p><div class="ex"><b>Keliru:</b> "Kekurangan perawat" (ini penyebab, bukan risiko).<br><b>Benar:</b> Kemungkinan pasien risiko tinggi jatuh, yang disebabkan asesmen ulang tidak dilakukan tiap shift dan bel kamar mandi rusak, sehingga cedera dan masa rawat bertambah.</div><div class="ex"><b>Keuangan:</b> klaim BPJS pending · resume medis tidak lengkap dan koding tidak sesuai · pendapatan tertunda.<br><b>Reputasi:</b> keluhan waktu tunggu > 3 jam viral · dokter terlambat, antrean online belum terhubung · pemberitaan negatif.<br><b>Hukum:</b> rumah sakit digugat pasien · informed consent tidak lengkap · ganti rugi.</div>`)}
  ${step(3, "Analisis risiko: inheren dan residu (Lampiran 2–3)", `<p>Pilih <b>K</b> (kemungkinan) dari data frekuensi setahun terakhir dan <b>D</b> (dampak) dari akibat terburuk yang masuk akal. Bila kolom dampak klinis, keuangan, dan operasional/reputasi berbeda, pakai nilai tertinggi. Skor dan warna dihitung otomatis.</p><p>Tulis pengendalian yang sudah ada dan efektivitasnya, lalu isi <b>K dan D residu</b>. Turunkan skor hanya bila ada bukti, misalnya hasil audit kepatuhan. Pengendalian yang tidak efektif tidak menurunkan skor.</p><div class="ex"><b>Pasien jatuh:</b> inheren 5×4 = 20; asesmen ulang baru 60% patuh; residu 4×4 = 16.<br><b>Klaim pending:</b> 5×4 = 20 → 5×3 = 15. <b>Keluhan viral:</b> 4×4 = 16 → 4×3 = 12.<br><b>Informed consent:</b> 3×5 = 15 → tetap 15, karena sign-in hanya mengecek ada atau tidaknya formulir.</div><p class="small muted">Acuan level dapat dipilih UMR di Pengaturan (Lampiran 3B sebagai bawaan, sesuai Lampiran 10).</p>`)}
  ${step(4, "Evaluasi, pengajuan, dan validasi UMR", `<p>Aplikasi membandingkan skor residu dengan selera unit. Bila melebihi, kolom Ket. menjadi <b>Prioritas</b> dan risiko wajib dibuatkan RTP. Risiko di bawah selera tetap dicatat dan dipantau.</p><ol><li>Lini 1 menekan <b>Ajukan ke UMR</b> setelah register lengkap.</li><li>Lini 2 membuka risiko berstatus Diajukan, memberi <b>kode risiko</b>, lalu memilih <b>Validasi</b> atau <b>Kembalikan untuk revisi</b> dengan catatan.</li><li>Risiko Sangat Tinggi (Merah) dieskalasi ke Direktur.</li></ol>`)}
  ${step(5, "Analisis akar masalah (Lampiran 6)", `<p><b>Menu:</b> Analisis akar masalah, atau tombol RCA di register. Wajib untuk residu Tinggi dan Sangat Tinggi, paling lama 45 hari sejak validasi. Isi 5 Why sampai jawabannya berupa sistem, proses, atau kebijakan yang bisa diubah, lalu tulis akar penyebab dan rekomendasi. Isi tanggal selesai agar status RCA menjadi Selesai.</p><div class="ex"><b>Pasien jatuh:</b> turun sendiri ke kamar mandi → tidak tahu risikonya naik setelah sedatif → asesmen ulang tidak dilakukan → formulir belum ada di e-RM → SOP belum diperbarui dan tidak ada audit. <b>Akar:</b> asesmen ulang belum terintegrasi di e-RM dan serah terima.</div>`)}
  ${step(6, "Rencana tindak pengendalian (Lampiran 5)", `<p><b>Menu:</b> Rencana tindak (RTP) → Tambah RTP. Satu risiko boleh memiliki beberapa kegiatan. Setiap RTP memuat akar penyebab, kegiatan, pilihan penanganan, penanggung jawab, indikator, target triwulan, dan estimasi K × D setelah tindakan (dengan anggapan terlaksana 100%). Pastikan target berada di bawah selera unit.</p><div class="ex"><b>RI-PD-01:</b> formulir dan pengingat asesmen ulang Morse di e-RM · Kepala Ruang dan Tim SIMRS · kepatuhan ≥ 90% · TW IV · target 2×4 = 8.<br><b>IBS-01:</b> SPO informed consent sebelum premedikasi · Kepala IBS dan Komite Medik · kelengkapan 100% · TW III · target 1×5 = 5.</div>`)}
  ${step(7, "Pemantauan realisasi RTP (Lampiran 7)", `<p>Setiap akhir triwulan, buka RTP → <b>Catat realisasi</b> untuk periode yang dipilih: Sudah atau Belum, hambatan, dan tindak lanjut. Bila target lewat dan realisasi belum Sudah, status otomatis <b>Terlambat</b> dan masuk dasbor.</p><div class="ex"><b>Terlaksana belum tentu efektif:</b> audit RI-PD-01 sudah berjalan, tetapi kepatuhan baru 72% dari target 90%. Tandai Sudah untuk kegiatannya, lalu tulis capaian indikator di hambatan.</div>`)}
  ${step(8, "Peristiwa risiko dan insiden (Lampiran 8)", `<p><b>Menu:</b> Peristiwa & insiden → Catat peristiwa. Pilih jenis: KPCS, KNC, KTC, KTD, Sentinel, atau Non-klinis. Isi waktu kejadian dan waktu dilaporkan ke Direktur/UMR; aplikasi menghitung apakah ≤ 1×24 jam untuk sentinel dan kejadian yang ditandai signifikan. KTD dan Sentinel wajib ditandai sudah dilaporkan ke SIK (e-report Kemenkes).</p><div class="ex"><b>KTD:</b> pasien 72 tahun jatuh, fraktur pergelangan, rawat +3 hari, D = 3, kaitkan ke RI-PD-01.<br><b>Non-klinis signifikan:</b> somasi kuasa hukum pasien operasi, D = 5, kaitkan ke IBS-01, lapor ≤ 1×24 jam.</div>`)}
  ${step(9, "Laporan triwulan (Lampiran 9 dan 10)", `<p><b>Lini 1:</b> Laporan triwulan → Susun laporan. Ringkasan eksekutif terisi otomatis dari register, RTP, dan peristiwa. Tambahkan hambatan, rencana triwulan berikutnya, dan rekomendasi utama, lalu <b>Kirim laporan</b>.</p><p><b>Lini 2:</b> Susun laporan konsolidasi. Profil risiko, distribusi level, lima prioritas teratas, realisasi RTP per unit, dan kejadian signifikan terisi otomatis. Tambahkan rekomendasi untuk Direktur, lalu kirim. Laporan dapat diunduh sebagai HTML untuk dicetak atau ditandatangani.</p><p><b>Semesteran:</b> risiko klinis prioritas tinggi dinilai ulang setiap 6 bulan (Pasal 10 ayat 3). Perbarui K dan D residu di register pada TW II dan TW IV.</p>`)}
  <div class="panel" style="margin-top:14px"><h2>Pertanyaan umum</h2>
  <p><b>Apakah data saya terlihat unit lain?</b> Ya, semua pengguna di organisasi dapat membaca data agar Lini 2 dan Lini 3 bisa memantau. Lini 1 hanya dapat mengubah data unitnya sendiri.</p>
  <p><b>Saya salah memilih peran.</b> Tekan Ubah peran di bawah menu. UMR dan pemilik aplikasi dapat mengubah peran pengguna lain di Pengaturan.</p>
  <p style="margin:0"><b>Mengapa warna berbeda dengan matriks di Lampiran 3A?</b> Pedoman memuat dua rentang berbeda. Aplikasi memakai Lampiran 3B sebagai bawaan; UMR dapat mengubahnya di Pengaturan setelah ada penetapan resmi.</p></div>`;
}

/* ========== Modal framework ========== */
let onSave = null;
function openModal(title, body, opts = {}) {
  $("#dlgTitle").textContent = title;
  $("#dlgBody").innerHTML = body;
  const btns = (opts.buttons || [{ v: "save", t: "Simpan", pri: true }]).filter(Boolean);
  $("#dlgFoot").innerHTML = `<button class="btn" value="cancel">${opts.readOnly ? "Tutup" : "Batal"}</button>` + (opts.readOnly ? "" : btns.map((b) => `<button class="btn ${b.pri ? "pri" : ""}" value="${b.v}" ${b.danger ? 'style="color:var(--bad)"' : ""}>${esc(b.t)}</button>`).join(""));
  if (opts.readOnly) $("#dlgBody").querySelectorAll("input,select,textarea,button.rowbtn").forEach((el) => (el.disabled = true));
  onSave = opts.onSave || null;
  const d = $("#dlg"); if (!d.open) d.showModal();
  if (opts.after) opts.after($("#dlgBody"));
}
$("#dlgForm").addEventListener("submit", async (ev) => {
  const v = ev.submitter?.value;
  if (!v || v === "cancel" || !onSave) return;
  ev.preventDefault();
  const fd = {}; $("#dlgBody").querySelectorAll("[name]").forEach((el) => { if (el.type === "checkbox") fd[el.name] = el.checked; else fd[el.name] = el.value.trim(); });
  const out = await onSave(v, fd, $("#dlgBody"));
  if (out !== false) $("#dlg").close();
});
const fld = (name, label, val, o = {}) => {
  const t = o.type || "text", hint = o.hint ? `<span class="hint">${o.hint}</span>` : "";
  let inp;

    } });
}

  <h3>Ringkasan eksekutif</h3><ol><li>Jumlah risiko merah (Sangat Tinggi): ${c.dist[0]}</li><li>Jumlah RTP terlambat: ${c.late.length}</li><li>Tiga insiden utama: ${c.topEv.map(([, e]) => esc(e.jenis + " · " + unitName(e.unitId) + ": " + e.uraian)).join("; ") || "tidak ada"}</li><li>Kepatuhan pelaporan eksternal (Kemenkes): ${c.sik.length ? `${c.sikOk} dari ${c.sik.length}` : "tidak ada KTD/Sentinel"}</li><li>Rekomendasi utama untuk Direktur: ${esc(rep.rekomendasi || "–")}</li></ol>
  <h3>A. Profil risiko rumah sakit</h3><p>Total risiko teridentifikasi: ${tot} risiko.</p><table><tr><th>Level</th><th>Jumlah</th><th>%</th></tr>${LVN.map((n, i) => `<tr><td>${n}</td><td>${c.dist[i]}</td><td>${tot ? pct(c.dist[i], tot) : 0}%</td></tr>`).join("")}</table>
  <p>Top 5 risiko prioritas:</p><table><tr><th>No</th><th>Kode</th><th>Risiko</th><th>Unit</th><th>Residu</th></tr>${c.top.map(([, r], i) => `<tr><td>${i + 1}</td><td>${esc(r.kode)}</td><td>${esc(r.peristiwa)}</td><td>${esc(unitName(r.unitId))}</td><td>${res(r)} ${lvl(res(r)).n}</td></tr>`).join("")}</table>
  <h3>B. Evaluasi pengendalian</h3><p>Realisasi RTP seluruh unit: ${c.due.length ? pct(c.done.length, c.due.length) : 0}% (dari ${c.due.length} RTP jatuh tempo).</p>${c.perUnit.length ? `<p>Unit dengan realisasi tertinggi: ${esc(c.perUnit[0][0])} (${c.perUnit[0][1]}%). Terendah: ${esc(c.perUnit[c.perUnit.length - 1][0])} (${c.perUnit[c.perUnit.length - 1][1]}%).</p>` : ""}<p>Ringkasan hambatan utama: ${esc(rep.hambatan || "–")}</p>
  <h3>C. Kejadian risiko signifikan</h3><table><tr><th>Tanggal</th><th>Unit</th><th>Jenis</th><th>Uraian</th><th>Tindakan</th></tr>${c.signif.map(([, e]) => `<tr><td>${fmtDate(e.waktuKejadian)}</td><td>${esc(unitName(e.unitId))}</td><td>${esc(e.jenis)}</td><td>${esc(e.uraian)}</td><td>${esc(e.tindakan)}</td></tr>`).join("")}</table>
  <h3>D. Rekomendasi UMR</h3><p>${esc(rep.rekomendasi || "–")}</p><p style="text-align:right">Semarang, ${rep.sentAt ? fmtDate(rep.sentAt) : "………………"}</p>
  <div class="ttd"><div>Mengetahui,<br>Ketua Komite Mutu<br><br><br><br>Nama Lengkap<br>NIP/NIK</div><div><br>Ketua Sub Unit Manajemen Risiko (UMR)<br><br><br><br>Nama Lengkap<br>NIP/NIK</div></div>`;
  saveFile(`Laporan_Konsolidasi_UMR_${key}.html`, docShell("Laporan konsolidasi UMR", inner));
}

/* ========== Event handlers ========== */
const ACT = {
  go: (d) => { S.view = d.v; window.scrollTo(0, 0); render(); },
  heat: (d) => { S.reg = { k: d.k, d: d.d }; S.view = "register"; render(); },
  clearheat: () => { S.reg = {}; render(); },
  unitfilter: (d) => { S.f.unit = d.id; render(); },
  openrisk: (d) => openRisk(d.id), newrisk: () => openRisk(null), editrca: (d) => openRCA(d.id),
  newrtp: (d) => openRTP(null, d.risk), editrtp: (d) => openRTP(d.id), monitor: (d) => openMonitor(d.id),
  newevent: () => openEvent(null), editevent: (d) => openEvent(d.id),
  editkonteks: (d) => openKonteks(d.id), editunit: (d) => openUnit(d.id),
  editreport: (d) => openReport(d.id), editumr: () => openUMR(), dlreport: (d) => dlReport(d.id), dlumr: () => dlUMR(), csvreg: () => csvRegister(),
  newaudit: () => openAudit(null), editaudit: (d) => openAudit(d.id),
  pickrole: (d) => { if (S.mode === "local") { toast("Di mode lokal, pilih peran dari menu Coba sebagai."); return; } openRole(d.id); },
  savecfg: async () => { const t = +$("#cfgTahun").value, a = $("#cfgAcuan").value, s = +$("#cfgSelera").value; if (!t || !s) return; await putCfg(Object.assign({}, S.cfg, { tahun: t, acuan: a, seleraDefault: s })); toast("Acuan penilaian disimpan."); },
  delcontoh: async () => { if (!confirm("Hapus semua data contoh? Data riil tidak terpengaruh.")) return; for (const c of COLS) for (const [id, x] of Object.entries(S[c])) if (x.contoh) await del(c, id); toast("Data contoh dihapus."); },
};
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]"); if (!a || a.tagName === "SELECT" || (a.tagName === "INPUT")) return;
  e.preventDefault(); const f = ACT[a.dataset.act]; if (f) f(a.dataset, a);
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.filter) { S.f[t.dataset.filter] = t.dataset.filter === "unit" ? t.value : +t.value; render(); return; }
  if (t.dataset.act === "regstatus") { S.reg.status = t.value; render(); }
  if (t.dataset.act === "regprio") { S.reg.prio = t.checked; render(); }
  if (t.dataset.act === "localrole") { S.me.role = t.value; S.ui.localRole = t.value; render(); }
  if (t.dataset.act === "localunit") { S.me.unitId = t.value; render(); }
});
init();
</script>
</body>
